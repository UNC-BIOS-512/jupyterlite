repos:
  # Strip outputs/execution counts from notebooks. Student-facing notebooks in
  # content/ ship unexecuted, and stored outputs make diffs unreadable.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  - repo: local
    hooks:
      - id: check-kernel-deps-sync
        name: check kernel deps sync (environment.yml vs pixi.toml author feature)
        entry: pixi run --environment default python scripts/check_kernel_deps_sync.py
        language: system
        files: ^(environment\.yml|pixi\.toml)$
        pass_filenames: false
