[workspace]
name = "jupyterlite"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"] # CI runner + your laptop

[dependencies]
python = "3.12.*"
jupyterlite-core = ">=0.7,<0.9"
jupyterlite-xeus = ">=4.3"
micromamba = "==2.0.2"
jupyter_server = "*"
notebook = ">=7.5"
# Prebuilt/federated JupyterLab extension, no server component required -
# safe to bundle into the JupyterLite build (jupyter lite build picks up
# federated extensions from this env's site-packages).
jupyterlab_rise = "*"

[tasks]
clean = "rm -rf dist .jupyterlite.doit.db"
build = { cmd = "jupyter lite build --contents content --output-dir dist", depends-on = ["clean"] }
serve = "jupyter lite serve --base-url /jupyterlite/ --port 8000"

# Local authoring env: same kernels as the browser build (xeus-python, xeus-r),
# but native builds (conda-forge) instead of emscripten-forge/WASM, so they run
# under a normal local Jupyter server. Keep package names in sync with
# environment.yml — enforced by scripts/check_kernel_deps_sync.py.
#
# The "chuckpr" channel here is scoped to this feature only (not added to the
# workspace [workspace.channels]) to avoid mixing its build stack with
# conda-forge's for every other dependency. It carries r-cowsay, custom-built
# for the browser kernel — see scripts/r-cowsay-recipe/.
[feature.author]
channels = ["conda-forge", "chuckpr"]

[feature.author.dependencies]
jupyterlab = "*"
xeus-python = "*"
xeus-r = "*"
r-ggplot2 = "*"
r-dplyr = "*"
r-readr = "*"
r-palmerpenguins = "*"
jupyterlab_rise = "*"
r-cowsay = { version = "*", channel = "chuckpr" }

[feature.author.tasks]
lab = "jupyter lab --notebook-dir=content"

[environments]
default = { solve-group = "default" }
author = { features = ["author"], solve-group = "author" }
